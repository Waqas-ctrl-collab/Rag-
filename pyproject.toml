[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Waqas-ctrl-collab", email = "wrajput278@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.3.23",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-groq>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "pymupdf>=1.28.2",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
